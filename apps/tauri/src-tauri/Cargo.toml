[package]
name = "gameshare-tauri"
version = "1.6.2"
description = "GameShare desktop client for WebView2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
getrandom = "0.4"
if-addrs = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
socketioxide = "0.18"
tauri = { version = "2", features = [] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
